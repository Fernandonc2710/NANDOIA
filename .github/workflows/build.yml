name: Compilar APK con Buildozer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install --upgrade cython buildozer virtualenv

      - name: Compilar APK
        run: |
          buildozer --spec ./buildozer.spec -v android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Nando-APK
          path: bin/*.apk
