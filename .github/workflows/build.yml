name: Compilar APK con Buildozer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install --upgrade cython buildozer virtualenv

      - name: Preconfigurar licencias de Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\nd97546511520697e188b0f6449ed98d0022a3313" > ~/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license

      - name: Generar especificacion limpia
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Nando
          package.name = nando
          package.domain = org.fernando
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy,requests,reportlab,python-docx,pillow
          orientation = portrait
          fullscreen = 0

          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.build_tools_version = 33.0.2
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Nando-APK
          path: bin/*.apk
          
