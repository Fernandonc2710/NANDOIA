name: Compilar APK con Buildozer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libjpeg-dev libpng-dev libfreetype6-dev
          pip3 install --upgrade pip
          pip3 install "cython<3.0.0" buildozer virtualenv

      - name: Preparar herramientas de Android para Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools/
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar librerias puras en carpeta aislada
        run: |
          mkdir -p libs
          pip3 install --target=libs reportlab python-docx pillow requests charset-normalizer urllib3 idna chardet
          
          # Inyectar la ruta de libs al inicio de main.py si no esta presente
          if ! grep -q "sys.path.insert(0, 'libs')" main.py; then
            sed -i "1s|^|import sys, os\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), 'libs'))\n\n|" main.py
          fi

      - name: Configurar buildozer.spec y compilar
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Nando
          package.name = nando
          package.domain = org.fernando
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          source.include_patterns = libs/*,libs/**/*
          version = 0.1
          requirements = python3==3.11.9,hostpython3==3.11.9,kivy
          orientation = portrait
          fullscreen = 0

          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.archs = arm64-v8a
          p4a.branch = release-2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

          buildozer -v android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Nando-APK
          path: bin/*.apk
